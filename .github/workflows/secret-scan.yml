# Secret scanning, by the estate's shared workflow. The whole of a consuming
# repository's file is the `uses:` line — the scanner version, the flags and
# the working-tree scope are decided once, in flashy-infra, and a change there
# reaches this repository on its next run. The reusable workflow takes no
# secrets and its two inputs (`config`, `version`) have defaults this
# repository has no reason to override: it ships no conformance vectors or
# signed fixtures that would need a .gitleaks.toml allowlist.

name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    uses: FlashyLabs/flashy-infra/.github/workflows/secret-scan-reusable.yml@main
